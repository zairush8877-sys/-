name: Собрать медиа и репосты

# Картинки и видео раньше рисовались локально и попадали в репозиторий вместе
# с коммитом. Это привязывало конвейер к машине, где идёт работа: без неё пост
# в очереди есть, а файла к нему нет — и публикация падает на скачивании.
# Здесь тот же рендер выполняется в Actions и коммитит результат.
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID поста (пусто — pending и approved); одобрения и даты не меняются'
        required: false
        type: string

permissions:
  contents: write

# Prepared files and publication statuses have one writer at a time.
concurrency:
  group: instagram-publishing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      BUILD_POST_ID: ${{ inputs.post_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить Chromium для Playwright
        run: npx playwright install --with-deps chromium

      - name: Собрать посты, Reels, метаданные и все кадры Stories
        run: node build-media.js "$BUILD_POST_ID"

      - name: Проверить результат валидатором отправителя
        run: node publish.js --validate-prepared "$BUILD_POST_ID"

      - name: Сохранить полностью проверенную сборку
        run: |
          for item in content/images content/reels content/reposts content/prepared content/preview.html; do
            if [ -e "$item" ]; then git add -A -- "$item"; fi
          done
          if git diff --cached --quiet; then
            echo "Новых файлов сборки нет."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Собраны медиа, метаданные и репосты"
          git push
